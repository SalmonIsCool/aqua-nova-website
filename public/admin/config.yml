backend:
  name: git-gateway
  branch: main

media_folder: "public/assets"
public_folder: "/assets"

collections:
  - name: "news"
    label: "News"
    folder: "src/content/news"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Cover image", name: "coverImage", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "events"
    label: "Events"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Start date", name: "date", widget: "datetime" }
      - { label: "End date", name: "endDate", widget: "datetime", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "media"
    label: "Media"
    folder: "src/content/media"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Type"
        name: "type"
        widget: "select"
        options: ["image", "video", "download"]
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "External URL", name: "url", widget: "string", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "hub-drivers"
    label: "Hub driver accounts"
    files:
      - file: "public/data/hub-drivers.json"
        label: "Approved drivers"
        name: "hub-drivers"
        fields:
          - label: "Drivers"
            name: "drivers"
            widget: "list"
            fields:
              - { label: "Email (same as Identity invite)", name: "email", widget: "string" }
              - { label: "Trucky user ID", name: "truckyUserId", widget: "number" }
              - { label: "Display name", name: "name", widget: "string" }
