[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  included_files = ["public/data/hub-drivers.json"]

[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888
  autoLaunch = false

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/api/leaderboard"
  to = "/.netlify/functions/leaderboard"
  status = 200

[[redirects]]
  from = "/api/my-stats"
  to = "/.netlify/functions/my-stats"
  status = 200

[[redirects]]
  from = "/api/my-jobs"
  to = "/.netlify/functions/my-jobs"
  status = 200
